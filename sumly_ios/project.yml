name: Sumly
options:
  bundleIdPrefix: com.oryjk
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 237PA3LEYJ
targets:
  Sumly:
    type: application
    platform: iOS
    sources:
      - Sumly/Sources
      - Sumly/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oryjk.sumly
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sumly/Support/Info.plist
      properties:
        CFBundleDisplayName: 记金
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: NeoBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SumlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Sumly
schemes:
  Sumly:
    build:
      targets:
        Sumly: all
    test:
      targets:
        - SumlyTests
